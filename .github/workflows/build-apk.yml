name: Build Google TV SP3 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Unzip single-upload source archive
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f settings.gradle ]; then
            ZIP=$(find . -maxdepth 1 -type f -name 'GoogleTV-Tenda-SP3-Switch*.zip' -print -quit)
            if [ -z "$ZIP" ]; then
              echo 'Upload GoogleTV-Tenda-SP3-Switch-v1-OneUpload.zip to the repository ROOT first.'
              exit 1
            fi
            unzip -oq "$ZIP" -d .
          fi
          test -f settings.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/tenda/sp3quick/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ ! -d "$SDK/platforms/android-35" ] || [ ! -d "$SDK/build-tools/35.0.0" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"

      - name: Build Google TV APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Downloadable TV APK
        uses: actions/upload-artifact@v4
        with:
          name: GoogleTV-Tenda-SP3-Switch-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
